name: Verify Handoff Fox

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux receiver
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s script -p 'test_*.py' -v
      - run: |
          for installer in script/install_{peer,omarchy,hypr_hotkey}.sh; do
            bash -n "$installer"
          done

  macos:
    name: macOS app
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash script/check_mac.sh
